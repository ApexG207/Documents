name: matIQ
options:
  bundleIdPrefix: com.apexgovernance
  deploymentTarget:
    iOS: "17.0"
targets:
  matIQ:
    type: application
    platform: iOS
    sources: [matIQ]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.apexgovernance.matiq
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    info:
      path: matIQ/Info.plist
      properties:
        CFBundleDisplayName: matIQ
        UILaunchScreen: {}
        NSCameraUsageDescription: matIQ uses the camera to record training and competition evidence you choose to upload.
        NSPhotoLibraryUsageDescription: matIQ accesses selected videos and photos for athlete-controlled evidence uploads.
        NSFaceIDUsageDescription: Face ID protects access to private athlete and academy records.
        UIBackgroundModes: [processing]
        BGTaskSchedulerPermittedIdentifiers: [com.apexgovernance.matiq.upload]
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: matIQ/matIQ.entitlements
      properties:
        com.apple.developer.associated-domains: [applinks:matiq-youth-bjj.apex-governa-8920.chatgpt.site]
        com.apple.developer.in-app-payments: []
