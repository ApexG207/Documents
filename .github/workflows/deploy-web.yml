name: Deploy Web Release

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Immutable tag or commit SHA
        required: true
        type: string
      target:
        description: Deployment environment
        required: true
        default: staging
        type: choice
        options: [staging, production]

permissions:
  contents: read

concurrency:
  group: deploy-web-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Require governed deployment hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.WEB_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOOK_URL"
          curl --fail --silent --show-error --request POST "$DEPLOY_HOOK_URL"
      - name: Optional health verification
        env:
          HEALTHCHECK_URL: ${{ secrets.WEB_HEALTHCHECK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$HEALTHCHECK_URL" ]; then
            for attempt in 1 2 3 4 5 6; do
              curl --fail --silent --show-error "$HEALTHCHECK_URL" && exit 0
              sleep 10
            done
            exit 1
          fi
